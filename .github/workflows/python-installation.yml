name: Installing Python

on: [push]

   
jobs:
  build:
    strategy:
      matrix:
       os: [macos-14, windows-latest, ubuntu-latest]
       py-version: [3.12, 3.11, 3.10]
       exclude:
         - os:  macos-14
           py-version: [3.12, 3.10]
         - os: ubuntu-latest
           py-version: 3.10
    runs-on: ${{ matrix.os }}    
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.py-version }}
        
